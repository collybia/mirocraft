name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod: pinning the version here as well means two
          # places to bump, and the mismatch shows up as the go command
          # quietly downloading a different toolchain mid-job.
          go-version-file: go.mod
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The console fan-out, the ring buffer and the WebSocket pumps are all
      # concurrent, so the race detector is the point of this job. It needs cgo,
      # which is why it runs here rather than in the cross-compilation job.
      #
      # The timeout is a guard against a hang, not a performance budget: a
      # runner under load is several times slower than a laptop, and a limit
      # tight enough to be a budget fails on load instead of on a hang.
      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race -timeout 15m ./...

  web:
    name: Web panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Every theme must stay readable; a theme that fails WCAG AA does not
      # get merged.
      - name: Theme contrast
        run: npm run test:themes

      # The project rule is that components hold no colour literals. This is
      # where that rule is enforced rather than left to review.
      - name: No colour literals
        run: npm run test:colors

      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod: pinning the version here as well means two
          # places to bump, and the mismatch shows up as the go command
          # quietly downloading a different toolchain mid-job.
          go-version-file: go.mod
          check-latest: true
      # v8 is what installs golangci-lint v2, which is the format .golangci.yml
      # is written in. v6 installs the 1.x line, which refuses this go.mod
      # outright — it is built against an older Go than the one targeted here.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod: pinning the version here as well means two
          # places to bump, and the mismatch shows up as the go command
          # quietly downloading a different toolchain mid-job.
          go-version-file: go.mod
          check-latest: true

      # The Go binary embeds web/dist, so the panel is built first. Without
      # this the embed falls back to the placeholder and the binary ships
      # without a panel.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the panel
        working-directory: web
        run: npm ci && npm run build

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" ./cmd/mirocraft
