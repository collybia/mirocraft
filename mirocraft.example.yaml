# Пример конфигурации Mirocraft.
# Скопируйте в mirocraft.yaml и правьте под себя — все поля необязательные,
# пропущенное берётся из встроенных значений по умолчанию.
#
# Приоритет, от низшего к высшему:
#   значения по умолчанию → этот файл → переменные окружения → флаги CLI
#
# Переменные окружения — с префиксом MIROCRAFT_ и подчёркиваниями вместо
# вложенности: MIROCRAFT_ADDR, MIROCRAFT_LOG_LEVEL, MIROCRAFT_RUNNER_TYPE,
# MIROCRAFT_RUNNER_STOP_TIMEOUT, MIROCRAFT_CONSOLE_BUFFER_LINES,
# MIROCRAFT_CONSOLE_TICKET_TTL.
#
# Опечатка в имени ключа — это ошибка запуска, а не молча проигнорированная
# настройка.

# Адрес, на котором слушает API и веб-панель.
addr: ":8080"

# Каталог с данными серверов, бэкапами и базой.
data_dir: "./data"

log:
  # debug | info | warn | error
  level: "info"
  # text — для человека, json — для сборщика логов
  format: "text"

runner:
  # Как запускать серверы:
  #
  #   auto    — Docker, если демон отвечает, иначе процессы
  #   docker  — только Docker; если демон недоступен, панель не стартует.
  #             Строго: получить процессы вместо явно запрошенных контейнеров
  #             значит работать в конфигурации, которую не просили, и не иметь
  #             способа это заметить
  #   process — только процессы
  #
  # В контейнере сервер получает настоящий лимит памяти и Java из образа —
  # ставить рантайм на хост не нужно. DOCKER_HOST учитывается, если демон
  # слушает не там, где обычно.
  type: "auto"
  # Сколько ждать штатной остановки сервера, прежде чем убить процесс.
  stop_timeout: "60s"

console:
  # Сколько строк консоли держать в памяти на каждый сервер.
  # Это же значение — потолок для ?lines= в /console/history.
  buffer_lines: 1000
  # Время жизни одноразового тикета для WebSocket-консоли.
  ticket_ttl: "30s"

dns:
  # Имя, по которому доступны панель и серверы. Целиком необязательно:
  # панель, к которой ходят по IP, ничего отсюда не требует.
  #
  #   desec      — бесплатный поддомен вида имя.dedyn.io. Умеет SRV, поэтому
  #                сервер на нестандартном порту находится по одному имени
  #   duckdns    — бесплатный поддомен вида имя.duckdns.org. SRV не умеет:
  #                игрокам придётся вводить порт для всего, что не на 25565
  #   cloudflare — свой домен, уже делегированный на Cloudflare
  #
  # Пусто — DNS выключен. Указан provider, но нет zone или token — демон не
  # стартует: наполовину настроенный DNS хуже выключенного, потому что имя
  # молча не резолвится, и понять почему изнутри панели нельзя.
  provider: ""
  # Домен: "имя.dedyn.io", "имя" для DuckDNS, свой домен для Cloudflare.
  zone: ""
  # Токен провайдера. Живёт в файле, а не в базе: это инфраструктурный
  # секрет оператора, а не то, что пользователь панели может прочитать.
  token: ""
  # Имя под зоной, под которым публикуется адрес самой панели.
  # Пусто — публикуется сама зона, чего и хочет бесплатный поддомен.
  sub: ""
  # TTL записей. Провайдеры поднимают его до своего минимума: у deSEC это
  # час, и запрос меньшего значения он отвергает целиком, а не округляет.
  ttl: 300
  # Как часто перепроверять внешний адрес. Домашнее соединение меняет его
  # адрес самое большее несколько раз в сутки, поэтому чаще смысла нет, а
  # бесплатные сервисы определения адреса просят их не долбить.
  check_interval: "5m"

webhooks:
  # Разрешить доставку вебхуков на loopback и приватные адреса.
  #
  # По умолчанию выключено. URL хука задаёт пользователь, а запрос выполняет
  # демон — это ровно форма SSRF: хук на 169.254.169.254 или на собственный
  # порт панели превращает её в прокси по своей же сети. Если бот живёт на
  # той же машине, включайте осознанно.
  allow_private_hosts: false
